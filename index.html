<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kevin's Soundboard</title>
<style>
  :root{
    --bg: #14151a;
    --panel: #1c1e26;
    --panel-2: #232633;
    --text: #f2f3f7;
    --muted: #9298ac;
    --accent: #7c5cff;
    --danger: #ef4444;
    --tile-radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { padding: 24px 16px 80px; }
  .wrap { max-width: 980px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.92rem; margin: 0; }
  .subtitle code { background: #232633; padding: 1px 6px; border-radius: 5px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    padding: 12px 14px;
    background: var(--panel);
    border-radius: 12px;
  }
  .toolbar label { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .toolbar input[type="range"] { width: 140px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    color: var(--text);
    background: var(--panel-2);
    transition: transform 0.06s ease, background 0.15s ease;
  }
  button:hover { background: #2b2f40; }
  button:active { transform: scale(0.97); }
  .btn-danger { background: rgba(239,68,68,0.15); color: #ff8a8a; }
  .btn-danger:hover { background: rgba(239,68,68,0.28); }
  .spacer { flex: 1; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin: 20px 0 30px;
  }
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--tile-radius);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.25;
    color: white;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25) inset, 0 6px 14px rgba(0,0,0,0.25);
    transition: transform 0.08s ease, box-shadow 0.15s ease;
    word-break: break-word;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile:active { transform: translateY(0px) scale(0.97); }
  .tile.playing {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.85) inset, 0 6px 18px rgba(0,0,0,0.35);
    animation: pulse 0.5s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { filter: brightness(1); }
    to { filter: brightness(1.18); }
  }
  .key-badge {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 0.68rem;
    font-weight: 700;
    background: rgba(0,0,0,0.35);
    padding: 2px 6px;
    border-radius: 6px;
    letter-spacing: 0.02em;
  }
  .empty-state, .error-state {
    color: var(--muted);
    background: var(--panel);
    border-radius: 12px;
    padding: 28px;
    text-align: center;
    line-height: 1.6;
  }
  .error-state { color: #ff8a8a; }
  .error-state code, .empty-state code { background: #10111a; padding: 2px 6px; border-radius: 5px; }
  .hidden { display: none !important; }

  .bot-status {
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 999px;
    background: #232633;
    white-space: nowrap;
  }
  .bot-status--unknown { color: var(--muted); }
  .bot-status--connected { color: #7CFC9E; background: rgba(34,197,94,0.15); }
  .bot-status--idle { color: #eab308; background: rgba(234,179,8,0.15); }
  .bot-status--offline { color: var(--muted); background: rgba(146,152,172,0.12); }

  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔊 Friend Group Soundboard</h1>
    <p class="subtitle">Click a tile to play it. The grid is built live from whatever's in the <code>Sounds</code> folder of the GitHub repo.</p>
  </header>

  <div class="toolbar">
    <label>Volume
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
    </label>
    <span id="botStatus" class="bot-status bot-status--unknown">● Checking Discord bot…</span>
    <div class="spacer"></div>
    <button id="refreshBtn">↻ Refresh</button>
    <button id="stopAllBtn" class="btn-danger">⏹ Stop All</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state hidden">No sounds in the <code>Sounds</code> folder yet.</div>
  <div id="errorState" class="error-state hidden"></div>

  <footer>Sounds are managed directly on GitHub — nothing to upload here.</footer>
</div>

<script>
  // ---- Configure this for your repo -----------------------------------
  const GITHUB_OWNER = "KRexroth";
  const GITHUB_REPO = "SoundBoard";
  const GITHUB_BRANCH = "main";
  const SOUNDS_FOLDER = "Sounds";
  // -----------------------------------------------------------------------

  // ---- Discord bot bridge ------------------------------------------------
  // Fill these in once the bot (see the "bot" folder) is running and you've
  // set up a tunnel (e.g. ngrok) so this public webpage can reach it.
  // Leave BOT_BASE_URL empty to disable this entirely — tiles will just
  // keep playing locally in the browser, like before.
  const BOT_BASE_URL = ""; // e.g. "https://your-name.ngrok-free.app" (no trailing slash)
  const BOT_SECRET = "";   // must match PLAY_SECRET in the bot's .env
  const BOT_HEALTH_POLL_MS = 15000;
  // -----------------------------------------------------------------------

  const KEY_ORDER = "1234567890qwertyuiopasdfghjklzxcvbnm".split("");
  const PALETTE = ["#7c5cff", "#22c55e", "#ef4444", "#eab308", "#06b6d4", "#f97316", "#ec4899", "#8b5cf6", "#10b981"];
  const AUDIO_EXTS = new Set(["mp3", "wav", "ogg", "m4a", "flac"]);

  let SOUNDS = [];
  let activeAudios = [];

  const grid = document.getElementById("grid");
  const emptyState = document.getElementById("emptyState");
  const errorState = document.getElementById("errorState");
  const volumeSlider = document.getElementById("volumeSlider");
  const stopAllBtn = document.getElementById("stopAllBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  const botStatusEl = document.getElementById("botStatus");

  function currentVolume() {
    return parseFloat(volumeSlider.value);
  }

  function humanize(filename) {
    const stem = filename.replace(/\.[^/.]+$/, "");
    const words = stem.split(/[-_]+/).map(w => (/^[a-z0-9]+$/.test(w) ? w[0].toUpperCase() + w.slice(1) : w));
    return words.join(" ") || filename;
  }

  function playSound(sound, tileEl) {
    const audio = new Audio(sound.url);
    audio.volume = currentVolume();
    activeAudios.push(audio);

    tileEl.classList.add("playing");
    const stopVisual = () => {
      tileEl.classList.remove("playing");
      activeAudios = activeAudios.filter(a => a !== audio);
    };
    audio.addEventListener("ended", stopVisual);
    audio.addEventListener("error", () => {
      stopVisual();
      console.warn("Couldn't play " + sound.url);
    });

    audio.play().catch(err => {
      stopVisual();
      console.warn("Playback blocked or failed:", err);
    });

    triggerDiscordPlay(sound.name);
  }

  // ---- Discord bot bridge --------------------------------------------------

  function setBotStatus(state, text) {
    botStatusEl.className = "bot-status bot-status--" + state;
    botStatusEl.textContent = text;
  }

  async function pollBotHealth() {
    if (!BOT_BASE_URL) {
      setBotStatus("offline", "○ Discord bot not set up");
      return;
    }
    try {
      const res = await fetch(BOT_BASE_URL + "/health");
      if (!res.ok) throw new Error("bad status " + res.status);
      const data = await res.json();
      if (data.connected) {
        setBotStatus("connected", "● Bot connected — tiles play in Discord too");
      } else {
        setBotStatus("idle", "● Bot online, but not in a voice channel (use /join)");
      }
    } catch (err) {
      setBotStatus("offline", "○ Can't reach Discord bot");
    }
  }

  function triggerDiscordPlay(soundName) {
    if (!BOT_BASE_URL) return;
    fetch(BOT_BASE_URL + "/play", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-play-secret": BOT_SECRET,
      },
      body: JSON.stringify({ sound: soundName }),
    })
      .then(res => res.json().catch(() => ({})).then(data => ({ res, data })))
      .then(({ res, data }) => {
        if (!res.ok) {
          console.warn("Discord bot didn't play it:", data.error || res.status);
        }
      })
      .catch(err => console.warn("Couldn't reach Discord bot:", err));
  }

  function stopAll() {
    activeAudios.forEach(a => { a.pause(); a.currentTime = 0; });
    activeAudios = [];
    document.querySelectorAll(".tile.playing").forEach(t => t.classList.remove("playing"));
  }

  function renderGrid() {
    grid.innerHTML = "";
    if (SOUNDS.length === 0) {
      emptyState.classList.remove("hidden");
      return;
    }
    emptyState.classList.add("hidden");

    SOUNDS.forEach((sound, i) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.style.background = PALETTE[i % PALETTE.length];
      btn.textContent = sound.name;
      btn.title = "Play " + sound.name;

      const key = KEY_ORDER[i];
      if (key) {
        const badge = document.createElement("span");
        badge.className = "key-badge";
        badge.textContent = key.toUpperCase();
        btn.appendChild(badge);
        sound._key = key;
      }

      btn.addEventListener("click", () => playSound(sound, btn));
      grid.appendChild(btn);
    });
  }

  async function loadSounds() {
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeURIComponent(SOUNDS_FOLDER)}?ref=${GITHUB_BRANCH}`;
    try {
      const res = await fetch(apiUrl, { headers: { Accept: "application/vnd.github+json" } });
      if (res.status === 404) {
        SOUNDS = [];
        errorState.classList.add("hidden");
        renderGrid();
        return;
      }
      if (!res.ok) throw new Error("GitHub API responded with " + res.status);
      const entries = await res.json();

      SOUNDS = entries
        .filter(e => e.type === "file" && AUDIO_EXTS.has((e.name.split(".").pop() || "").toLowerCase()))
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(e => ({ name: humanize(e.name), url: e.download_url }));

      errorState.classList.add("hidden");
      renderGrid();
    } catch (err) {
      grid.innerHTML = "";
      emptyState.classList.add("hidden");
      errorState.classList.remove("hidden");
      errorState.innerHTML =
        "Couldn't load the sound list from GitHub.<br>" +
        "If you just added sounds, GitHub's API is occasionally a few seconds behind — try Refresh. " +
        "Otherwise check that the repo is public and the <code>" + SOUNDS_FOLDER + "</code> folder exists.";
      console.warn("Failed to load sounds:", err);
    }
  }

  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "Escape") { stopAll(); return; }

    const idx = SOUNDS.findIndex(s => s._key === e.key.toLowerCase());
    if (idx !== -1) {
      const tileEl = grid.children[idx];
      if (tileEl) playSound(SOUNDS[idx], tileEl);
    }
  });

  stopAllBtn.addEventListener("click", stopAll);
  refreshBtn.addEventListener("click", loadSounds);

  loadSounds();
  pollBotHealth();
  setInterval(pollBotHealth, BOT_HEALTH_POLL_MS);
</script>
</body>
</html>
